include: "https://gitlab.com/accessable-net/gitlab-ci-templates/-/raw/master/scheduled_rebase.yml"

default:
  cache:
    paths:
      - ~/.gradle
  before_script:
    - git clone https://github.com/oasisfeng/deagle ../deagle
  image: circleci/android:api-29

variables:
  UPSTREAM_BRANCH: dev

LintDebug:
  stage: test
  script:
    - ./gradlew -Pci --console=plain :app:lintDebug -PbuildDir=lint

AssembleDebug:
  stage: build
  script:
    - ./gradlew assembleCompleteDebug
  artifacts:
    paths:
      - /app/build/outputs/

DebugTests:
  stage: test
  script:
    - ./gradlew -Pci --console=plain :app:testDebug

AssembleCompleteRelease:
  stage: build
  script:
    - echo $KEYSTORE_FILE | base64 -d > my.keystore
    - ./gradlew assembleCompleteRelease
      -Pandroid.injected.signing.store.file=$(pwd)/my.keystore
      -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD
      -Pandroid.injected.signing.key.alias=$KEY_ALIAS
      -Pandroid.injected.signing.key.password=$KEY_PASSWORD
  artifacts:
    paths:
      - /app/build/outputs/apk/release
